<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalMatch - Post Emergency</title>
    <script>if(localStorage.getItem('vm_theme')==='dark')document.documentElement.classList.add('dark-mode');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-none d-lg-block">
        <div class="mb-5 text-center"><div class="py-3"><svg width="100" height="100" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="250" cy="220" r="190" stroke="#4F46E5" stroke-width="25"/><path d="M250 470C250 470 426 310 426 190C426 100 346 30 256 30C166 30 86 100 86 190C86 310 256 470 256 470Z" fill="#EF4444"/><path d="M256 340C256 340 366 250 366 170C366 110 316 70 256 70C196 70 146 110 146 170C146 250 256 340 256 340Z" fill="white" fill-opacity="0.2"/><path d="M256 270C285 270 306 247 306 215C306 185 256 120 256 120C256 120 206 185 206 215C206 247 227 270 256 270Z" fill="white"/></svg><h4 class="fw-bold mt-2" style="color:#1E293B;"><span style="color:#EF4444;">Vital</span>Match</h4></div></div>
        <div class="nav flex-column">
            <a href="dashboard.html" class="sidebar-link"><i class="fas fa-columns"></i> Dashboard</a>
            <a href="emergency-feed.html" class="sidebar-link"><i class="fas fa-broadcast-tower"></i> Emergency Feed</a>
            <a href="search-donors.html" class="sidebar-link"><i class="fas fa-search"></i> Search Donors</a>
            <a href="become-donor.html" class="sidebar-link"><i class="fas fa-hand-holding-medical"></i> Become Donor</a>
            <a href="notifications.html" class="sidebar-link"><i class="fas fa-bell"></i> Notifications</a>
            <a href="reports.html" class="sidebar-link"><i class="fas fa-file-alt"></i> Reports</a>
            <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
            <a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i> Settings</a>
            <hr class="my-4 text-muted">
            <a href="index.html" class="sidebar-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Post Blood Emergency</h2>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative cursor-pointer" onclick="window.location.href='notifications.html'" title="Notifications">
                    <i class="fas fa-bell fa-lg text-muted cursor-pointer"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </div>
                <div class="d-flex align-items-center gap-2 cursor-pointer" onclick="window.location.href='profile.html'" title="View Profile">
                    <img src="https://ui-avatars.com/api/?name=User&background=E53935&color=fff" class="rounded-circle user-avatar-display" width="40" height="40">
                    <div class="d-none d-sm-block"><p class="fw-bold mb-0 small user-name-display text-capitalize">User Name</p></div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="vm-card">
                    <div class="text-center mb-5">
                        <div class="bg-danger bg-opacity-10 text-danger p-4 rounded-circle d-inline-block mb-3">
                            <i class="fas fa-exclamation-triangle fa-3x"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Emergency Blood Request</h4>
                        <p class="text-muted">Fill in the details below to alert nearby donors immediately</p>
                    </div>

                    <div id="postError" class="alert alert-danger d-none rounded-4"></div>

                    <form id="emergencyForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Patient Name <span class="text-danger">*</span></label>
                                <input type="text" id="emPatientName" class="form-control bg-light border-0 py-3 rounded-3" placeholder="Patient's full name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Blood Group Required <span class="text-danger">*</span></label>
                                <select id="emBloodGroup" class="form-select bg-light border-0 py-3 rounded-3" required>
                                    <option value="" disabled selected>Select blood group</option>
                                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                    <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Hospital Name <span class="text-danger">*</span></label>
                                <input type="text" id="emHospital" class="form-control bg-light border-0 py-3 rounded-3" placeholder="Hospital where blood is needed" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Contact Number <span class="text-danger">*</span></label>
                                <input type="tel" id="emContact" class="form-control bg-light border-0 py-3 rounded-3" placeholder="Contact number" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">State <span class="text-danger">*</span></label>
                                <select id="emState" class="form-select bg-light border-0 py-3 rounded-3" required>
                                    <option value="" selected disabled>Select State</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">District <span class="text-danger">*</span></label>
                                <select id="emDistrict" class="form-select bg-light border-0 py-3 rounded-3" disabled required>
                                    <option value="" selected disabled>Select District</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Town/City <span class="text-danger">*</span></label>
                                <select id="emCity" class="form-select bg-light border-0 py-3 rounded-3" disabled required>
                                    <option value="" selected disabled>Select City</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Landmark / Hospital Area</label>
                                <input type="text" id="emLandmark" class="form-control bg-light border-0 py-3 rounded-3" placeholder="e.g. Near Main Gate, Block B">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Priority Level</label>
                                <select id="emPriority" class="form-select bg-light border-0 py-3 rounded-3">
                                    <option>High</option><option>Medium</option><option>Low</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold" data-i18n="additional_notes">Additional Notes</label>
                                <textarea id="emNotes" class="form-control bg-light border-0 py-3 rounded-3" rows="3" placeholder="Reason for emergency (e.g. Surgery, accident, units needed)..."></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" id="postEmergencyBtn" class="btn btn-danger w-100 py-3 fw-bold">
                                    <i class="fas fa-broadcast-tower me-2"></i>Post Emergency &amp; Notify Donors
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/india-locations.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
    async function pageInit() {
        if (!currentProfile) return;

        // Setup location dropdowns
        const stateEl = document.getElementById('emState');
        const districtEl = document.getElementById('emDistrict');
        const cityEl = document.getElementById('emCity');
        populateStates(stateEl);
        stateEl.addEventListener('change', () => {
            populateDistricts(districtEl, stateEl.value);
            districtEl.disabled = !stateEl.value;
            cityEl.innerHTML = '<option value="" selected disabled>Select City</option>';
            cityEl.disabled = true;
        });
        districtEl.addEventListener('change', () => {
            populateCities(cityEl, stateEl.value, districtEl.value);
            cityEl.disabled = !districtEl.value;
        });

        // Pre-fill contact from profile
        document.getElementById('emContact').value = currentProfile.mobile || '';
        if (currentProfile.state) {
            stateEl.value = currentProfile.state;
            populateDistricts(districtEl, currentProfile.state);
            districtEl.disabled = false;
            if (currentProfile.district) {
                districtEl.value = currentProfile.district;
                populateCities(cityEl, currentProfile.state, currentProfile.district);
                cityEl.disabled = false;
                if (currentProfile.city) cityEl.value = currentProfile.city;
            }
        }

        document.getElementById('emergencyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('postEmergencyBtn');
            const errDiv = document.getElementById('postError');
            errDiv.classList.add('d-none');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Posting Emergency...';

            const stateVal = stateEl.value || '';
            const districtVal = districtEl.value || '';
            const cityVal = cityEl.value || '';
            const landmarkVal = document.getElementById('emLandmark').value.trim();
            const fullLoc = [cityVal, districtVal, stateVal, landmarkVal].filter(Boolean).join(', ');

            const emergency = {
                user_id: currentProfile.id,
                patient_name: document.getElementById('emPatientName').value.trim(),
                blood_group: document.getElementById('emBloodGroup').value,
                hospital_name: document.getElementById('emHospital').value.trim(),
                contact_number: document.getElementById('emContact').value.trim(),
                location: fullLoc || 'Not specified',
                district: districtVal || null,
                state: stateVal || null,
                city: cityVal || null,
                priority: document.getElementById('emPriority').value,
                notes: document.getElementById('emNotes').value.trim(),
                status: 'Active'
            };

            const { data, error } = await DB.createEmergency(emergency);

            if (error) {
                errDiv.textContent = error.message || 'Failed to post emergency. Please try again.';
                errDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-broadcast-tower me-2"></i>Post Emergency & Notify Donors';
            } else {
                // Geo-Based Notifications: Send notifications to all donors in the same district
                if (districtVal) {
                    const { data: districtDonors } = await supabaseClient.from('profiles').select('id').eq('district', districtVal);
                    if (districtDonors && districtDonors.length > 0) {
                        const notifPromises = districtDonors
                            .filter(d => d.id !== currentProfile.id)
                            .map(donor => DB.createNotification({
                                user_id: donor.id,
                                title: `EMERGENCY: ${emergency.blood_group} Needed in ${districtVal}`,
                                message: `Urgent ${emergency.blood_group} blood request at ${emergency.hospital_name} (${cityVal}, ${districtVal}). Contact: ${emergency.contact_number}`,
                                type: 'URGENT'
                            }));
                        await Promise.all(notifPromises);
                    }
                }

                window.location.href = 'success.html?type=emergency';
            }
        });
    }
    </script>
</body>
</html>
