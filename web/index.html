<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalMatch - Log in to your Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-primary { background-color: #0052cc; }
        .text-primary { color: #0052cc; }
        .border-primary { border-color: #0052cc; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl flex flex-col md:flex-row max-w-5xl w-full overflow-hidden min-h-[600px]">

        <!-- Left Side: Login Form -->
        <div class="w-full md:w-1/2 p-8 md:p-16">
            <div class="flex items-center mb-10">
                <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center mr-3">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </div>
                <span class="text-2xl font-bold text-gray-800">VitalMatch</span>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 mb-2">Log in to your Account</h1>
            <p class="text-gray-500 mb-8">Welcome back! Select method to log in:</p>

            <!-- Social Login (Facebook Removed) -->
            <div class="mb-8">
                <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center border border-gray-200 rounded-xl py-3 px-4 hover:bg-gray-50 transition-all">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-6 h-6 mr-3" alt="Google">
                    <span class="font-medium text-gray-700">Continue with Google</span>
                </button>
            </div>

            <div class="relative flex items-center mb-8">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-sm">or continue with email</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path></svg>
                    </span>
                    <input type="email" placeholder="Email" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" required>
                </div>

                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" placeholder="Password" class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" required>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600">
                        <input type="checkbox" class="rounded text-blue-600 focus:ring-blue-500 mr-2 w-4 h-4">
                        Remember me
                    </label>
                    <a href="#" class="text-primary font-semibold hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                    Log In
                </button>
            </form>

            <p class="text-center text-gray-500 mt-8 text-sm">
                Don't have an account? <a href="register.html" class="text-primary font-bold hover:underline">Create an account</a>
            </p>
        </div>

        <!-- Right Side: Marketing/Illustration -->
        <div class="hidden md:flex w-1/2 bg-primary p-16 flex-col justify-center items-center text-center relative overflow-hidden">
            <div class="absolute w-96 h-96 border border-white/10 rounded-full"></div>
            <div class="relative z-10 text-white">
                <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl mb-12 inline-block border border-white/20">
                    <img src="https://www.svgrepo.com/show/493407/dashboard-layout.svg" class="w-64 h-48 rounded-lg shadow-xl" alt="Dashboard Preview">
                </div>
                <h2 class="text-3xl font-bold mb-4">Find Your Perfect Match</h2>
                <p class="text-blue-100 text-lg mb-8 max-w-sm mx-auto">
                    Everything you need to manage your vitals and health matches in one professional dashboard.
                </p>
            </div>
        </div>
    </div>

    <script>
        function loginWithGoogle() {
            alert('Logging in through Google Mail...');
            // Simulating Google Mail Auth
            localStorage.setItem('vm_session', JSON.stringify({
                email: 'user@gmail.com',
                firstName: 'Google',
                lastName: 'User',
                loginTime: new Date().getTime()
            }));
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('input[type="email"]').value;
            // Simulated validation
            localStorage.setItem('vm_session', JSON.stringify({
                email: email,
                firstName: 'Vital',
                lastName: 'Member',
                loginTime: new Date().getTime()
            }));
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
