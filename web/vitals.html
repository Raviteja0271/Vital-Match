<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vitals - VitalMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-primary { background-color: #0052cc; }
        .text-primary { color: #0052cc; }
        .sidebar-item-active { background-color: rgba(0, 82, 204, 0.1); color: #0052cc; border-right: 4px solid #0052cc; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar (Same as Dashboard) -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col">
        <div class="p-6 flex items-center mb-6">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </div>
            <span class="text-xl font-bold text-gray-800">VitalMatch</span>
        </div>
        <nav class="flex-grow">
            <ul class="space-y-1">
                <li><a href="dashboard.html" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-all"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> Dashboard</a></li>
                <li><a href="#" class="sidebar-item-active flex items-center px-6 py-3 transition-all"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> Vitals</a></li>
                <li><a href="#" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-all"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> Matches</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
            <h2 class="text-xl font-semibold text-gray-800">Health Vitals</h2>
            <button class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-all">
                + Update Vitals
            </button>
        </header>

        <div class="flex-grow p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                        <h3 class="font-bold text-gray-900 text-lg">Vital History</h3>
                        <div class="flex space-x-2">
                            <select class="bg-gray-50 border border-gray-200 text-sm rounded-lg px-3 py-1 outline-none">
                                <option>Last 7 Days</option>
                                <option>Last 30 Days</option>
                            </select>
                        </div>
                    </div>

                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-4 font-medium">Date</th>
                                <th class="px-6 py-4 font-medium">Heart Rate</th>
                                <th class="px-6 py-4 font-medium">Blood Pressure</th>
                                <th class="px-6 py-4 font-medium">Spo2</th>
                                <th class="px-6 py-4 font-medium">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr class="hover:bg-gray-50 transition-all">
                                <td class="px-6 py-4 text-sm text-gray-900">Oct 24, 2023</td>
                                <td class="px-6 py-4 text-sm font-medium">72 BPM</td>
                                <td class="px-6 py-4 text-sm text-gray-600">120/80</td>
                                <td class="px-6 py-4 text-sm text-gray-600">98%</td>
                                <td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">Normal</span></td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-all">
                                <td class="px-6 py-4 text-sm text-gray-900">Oct 23, 2023</td>
                                <td class="px-6 py-4 text-sm font-medium">75 BPM</td>
                                <td class="px-6 py-4 text-sm text-gray-600">122/82</td>
                                <td class="px-6 py-4 text-sm text-gray-600">97%</td>
                                <td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">Normal</span></td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-all">
                                <td class="px-6 py-4 text-sm text-gray-900">Oct 22, 2023</td>
                                <td class="px-6 py-4 text-sm font-medium">88 BPM</td>
                                <td class="px-6 py-4 text-sm text-gray-600">130/85</td>
                                <td class="px-6 py-4 text-sm text-gray-600">96%</td>
                                <td class="px-6 py-4"><span class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs font-bold rounded-full">Elevated</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Input Section -->
                <div class="mt-8 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-900 text-lg mb-6">Log New Vitals</h3>
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Heart Rate (BPM)</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 72">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Systolic BP</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 120">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Oxygen Level (%)</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 98">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Body Temp (°F)</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 98.6">
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                                Save Entry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
