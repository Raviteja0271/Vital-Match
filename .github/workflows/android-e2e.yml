name: Enterprise Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build APK, Execute Appium E2E Suite & Publish Reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java 17
      - name: Stage 2 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Stage 3: Setup Android SDK
      - name: Stage 3 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Dependencies & Build APK
      - name: Stage 4 - Build Debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || true

      # Stage 5: Setup Node.js & Appium Server Engine
      - name: Stage 5 - Setup Node & Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true
          mkdir -p logs
          nohup appium --log logs/appium.log &
          sleep 3
          echo "Appium Server Health Check:"
          curl -s http://127.0.0.1:4723/status || echo "Appium server initialized"

      # Stage 6: Execute Appium E2E Test Suite (430 Test Cases)
      - name: Stage 6 - Execute Appium E2E Suite & Reports
        run: |
          python3 -m pip install openpyxl pytest requests aiohttp pandas Appium-Python-Client
          if [ -f "automation/requirements.txt" ]; then
            python3 -m pip install -r automation/requirements.txt || true
          fi
          python3 automation/runners/run_suite.py || true

      # Stage 7: Prepare Reports for GitHub Pages
      - name: Stage 7 - Prepare HTML & Excel Reports
        run: |
          mkdir -p reports/latest reports/HTML
          if [ -f "Test Results/HTML/execution-report.html" ]; then
            cp "Test Results/HTML/execution-report.html" reports/index.html
            cp "Test Results/HTML/execution-report.html" reports/execution-report.html
            cp "Test Results/HTML/execution-report.html" reports/latest/index.html
            cp "Test Results/HTML/execution-report.html" reports/latest/execution-report.html
          fi

      # Stage 8: Publish Action Step Summary
      - name: Stage 8 - Publish Action Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          elif [ -f "reports/latest/summary.md" ]; then
            cat "reports/latest/summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 9: Upload Test Artifacts
      - name: Stage 9 - Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalMatch-Appium-E2E-Reports-Build-${{ github.run_number }}
          path: |
            Test Results/
            reports/
          if-no-files-found: ignore
          retention-days: 30

      # Stage 10: Deploy Reports to GitHub Pages
      - name: Stage 10 - Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
