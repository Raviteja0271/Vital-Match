name: Enterprise Web Selenium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web-selenium-e2e:
    name: Execute Web Selenium 300 E2E Test Cases & Generate Reports
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Step 2 - Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Setup Node.js
      - name: Step 3 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 4: Install Dependencies
      - name: Step 4 - Install Test Dependencies
        run: |
          python3 -m pip install openpyxl selenium pandas requests aiohttp pytest
          npm install -g http-server || true

      # Step 5: Start Local Web Server
      - name: Step 5 - Start Local Web Server
        run: |
          nohup npx http-server . -p 8080 > server.log 2>&1 &
          sleep 3

      # Step 6: Execute Selenium Web E2E Suite
      - name: Step 6 - Execute Web E2E Test Suite
        continue-on-error: true
        run: |
          if [ -f "selenium-tests/run_e2e_separate_sheets.py" ]; then
            python3 selenium-tests/run_e2e_separate_sheets.py || true
          fi

      # Step 7: Upload Web Selenium Test Reports
      - name: Step 7 - Upload Web Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalMatch-Web-Selenium-E2E-Reports-Build-${{ github.run_number }}
          path: |
            selenium-tests/
            Test Results/
          if-no-files-found: ignore
          retention-days: 30
