<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalMatch - Emergency Feed</title>
    <script>if(localStorage.getItem('vm_theme')==='dark')document.documentElement.classList.add('dark-mode');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-none d-lg-block">
        <div class="mb-5 text-center"><div class="py-3"><svg width="100" height="100" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="250" cy="220" r="190" stroke="#4F46E5" stroke-width="25"/><path d="M250 470C250 470 426 310 426 190C426 100 346 30 256 30C166 30 86 100 86 190C86 310 256 470 256 470Z" fill="#EF4444"/><path d="M256 340C256 340 366 250 366 170C366 110 316 70 256 70C196 70 146 110 146 170C146 250 256 340 256 340Z" fill="white" fill-opacity="0.2"/><path d="M256 270C285 270 306 247 306 215C306 185 256 120 256 120C256 120 206 185 206 215C206 247 227 270 256 270Z" fill="white"/></svg><h4 class="fw-bold mt-2" style="color:#1E293B;"><span style="color:#EF4444;">Vital</span>Match</h4></div></div>
        <div class="nav flex-column">
            <a href="dashboard.html" class="sidebar-link"><i class="fas fa-columns"></i> <span data-i18n="dashboard">Dashboard</span></a>
            <a href="emergency-feed.html" class="sidebar-link active"><i class="fas fa-broadcast-tower"></i> <span data-i18n="emergency_feed">Emergency Feed</span></a>
            <a href="search-donors.html" class="sidebar-link"><i class="fas fa-search"></i> <span data-i18n="search_donors">Search Donors</span></a>
            <a href="become-donor.html" class="sidebar-link"><i class="fas fa-hand-holding-medical"></i> <span data-i18n="become_donor">Become Donor</span></a>
            <a href="notifications.html" class="sidebar-link"><i class="fas fa-bell"></i> <span data-i18n="notifications">Notifications</span></a>
            <a href="reports.html" class="sidebar-link"><i class="fas fa-file-alt"></i> <span data-i18n="reports">Reports</span></a>
            <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> <span data-i18n="profile">Profile</span></a>
            <a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i> <span data-i18n="settings">Settings</span></a>
            <hr class="my-4 text-muted">
            <a href="index.html" class="sidebar-link text-danger"><i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">Logout</span></a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Live Emergency Feed</h2>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative cursor-pointer" onclick="window.location.href='notifications.html'" title="Notifications">
                    <i class="fas fa-bell fa-lg text-muted cursor-pointer"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </div>
                <div class="d-flex align-items-center gap-2 cursor-pointer" onclick="window.location.href='profile.html'" title="View Profile">
                    <img src="https://ui-avatars.com/api/?name=User&background=E53935&color=fff" class="rounded-circle user-avatar-display" width="40" height="40">
                    <div class="d-none d-sm-block"><p class="fw-bold mb-0 small user-name-display text-capitalize">User Name</p></div>
                </div>
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger-subtle px-3 py-2">
                    <i class="fas fa-circle me-1 small"></i> Live Updates
                </span>
            </div>
        </div>

        <div id="emergencyFeedContainer" class="row g-4">
            <div class="col-12 text-center py-5"><span class="spinner-border text-primary"></span><p class="mt-3 text-muted">Loading emergencies...</p></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
    async function pageInit() {
        let emergencies = await DB.getEmergencies(50);
        const userDistrict = currentProfile ? currentProfile.district : null;

        if (userDistrict) {
            emergencies = emergencies.filter(e => 
                (e.district && e.district.toLowerCase() === userDistrict.toLowerCase()) ||
                (e.location && e.location.toLowerCase().includes(userDistrict.toLowerCase())) ||
                (e.user_id === currentProfile.id)
            );
        }

        const container = document.getElementById('emergencyFeedContainer');

        if (emergencies.length === 0) {
            container.innerHTML = `<div class="col-12 text-center py-5"><i class="fas fa-check-circle fa-3x text-success mb-3"></i><h5 class="text-muted">No active emergencies in ${userDistrict || 'your area'}</h5><p class="text-muted">All clear! Check back later or <a href="post-emergency.html">post an emergency</a>.</p></div>`;
            return;
        }

        container.innerHTML = emergencies.map(e => {
            const isConnected = e.status === 'Connected';
            const badgeClass = isConnected ? 'bg-success' : 'bg-danger';
            const notes = e.notes ? `<div class="bg-light p-3 rounded-3 mb-3"><p class="text-muted smaller mb-1 fw-bold"><i class="fas fa-sticky-note me-1"></i>Additional Notes:</p><p class="small mb-0 text-dark">${e.notes}</p></div>` : '';
            const contact = e.contact_number ? `<p class="text-muted smaller mb-2"><i class="fas fa-phone me-1 text-primary"></i> <strong>Contact:</strong> <a href="tel:${e.contact_number}" class="text-decoration-none fw-bold">${e.contact_number}</a></p>` : '';
            return `
            <div class="col-md-6">
                <div class="vm-card">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="badge ${badgeClass} status-badge px-3 py-2 rounded-pill">${e.status}</span>
                        <span class="text-muted small fw-bold">${timeAgo(e.created_at)}</span>
                    </div>
                    <h5 class="fw-bold mb-1">${e.patient_name}</h5>
                    <p class="text-muted smaller mb-2"><i class="fas fa-map-marker-alt me-1 text-danger"></i> ${e.hospital_name}, ${e.location}</p>
                    ${contact}
                    <div class="row g-2 mb-3">
                        <div class="col-6"><div class="bg-light p-3 rounded-4"><p class="text-muted smaller mb-0">Blood Group</p><h4 class="fw-bold text-danger mb-0">${e.blood_group}</h4></div></div>
                        <div class="col-6"><div class="bg-light p-3 rounded-4"><p class="text-muted smaller mb-0">Priority</p><h4 class="fw-bold text-dark mb-0">${e.priority}</h4></div></div>
                    </div>
                    ${notes}
                    <div class="d-grid gap-2">
                        ${e.status === 'Completed'
                            ? '<button class="btn btn-success py-3" disabled><i class="fas fa-check-double me-2"></i>Blood Received & Completed</button>'
                            : `<button onclick="handleBloodReceived(this, '${e.id}')" class="btn btn-success py-3"><i class="fas fa-hand-holding-medical me-2"></i>Blood Received & Completed</button>`
                        }
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function handleBloodReceived(btn, emergencyId) {
        const donorInput = prompt("Enter Donor's Mobile Number or Name who donated blood:");
        if (!donorInput) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating Profile...';

        const success = await DB.markEmergencyCompletedAndRecordDonation(emergencyId, donorInput);
        if (success) {
            const card = btn.closest('.vm-card');
            const badge = card.querySelector('.status-badge');
            if (badge) {
                badge.innerText = 'Completed';
                badge.classList.remove('bg-danger');
                badge.classList.add('bg-success');
            }
            btn.innerHTML = '<i class="fas fa-check-double me-2"></i>Blood Received & Completed';
            btn.disabled = true;
            showToast("Blood Received! Donor's profile & last donation date updated.");
        } else {
            btn.disabled = false;
            btn.innerHTML = 'Blood Received & Completed';
            showToast('Failed to record donation.', 'danger');
        }
    }

    async function handleConnect(btn, emergencyId) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Connecting...';
        const result = await DB.markAsConnected(emergencyId);
        if (result) {
            const card = btn.closest('.vm-card');
            const badge = card.querySelector('.status-badge');
            badge.innerText = 'Connected';
            badge.classList.remove('bg-danger');
            badge.classList.add('bg-success');
            btn.innerHTML = '<i class="fas fa-check me-2"></i>Connected';
            btn.classList.remove('btn-indigo');
            btn.classList.add('btn-success');
            showToast('Connection marked successfully!');
        } else {
            btn.disabled = false;
            btn.innerHTML = 'Mark as Connected';
            showToast('Failed to mark connection.', 'danger');
        }
    }
    </script>
</body>
</html>
