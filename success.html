<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalMatch - Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .success-container { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
        .success-card { max-width:500px; width:100%; padding:50px; }
    </style>
</head>
<body class="bg-light">
    <div class="success-container">
        <div class="vm-card success-card">
            <div class="check-animated mb-4"><i class="fas fa-check"></i></div>
            <h1 id="successTitle" class="fw-bold mb-3 text-dark">Success!</h1>
            <p id="successMsg" class="text-muted mb-5 leading-relaxed">Your action was completed successfully.</p>
            <a id="successBtn" href="dashboard.html" class="btn btn-indigo w-100 py-3">Continue to Dashboard</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const title = document.getElementById('successTitle');
        const msg = document.getElementById('successMsg');
        const btn = document.getElementById('successBtn');
        const regName = localStorage.getItem('vm_reg_name') || 'User';

        if (type === 'register') {
            title.innerText = "Account Created Successfully";
            msg.innerText = `Welcome to the community, ${regName}! Your account has been created. You can now log in and start saving lives.`;
            btn.innerText = "Continue to Login";
            btn.href = "index.html";
            localStorage.removeItem('vm_reg_name');
        } else if (type === 'emergency') {
            title.innerText = "Emergency Posted";
            msg.innerText = "Your emergency request has been broadcasted to all nearby eligible donors. Stay alert for responses!";
            btn.innerText = "View Emergency Feed";
            btn.href = "emergency-feed.html";
        } else if (type === 'report') {
            title.innerText = "Report Submitted";
            msg.innerText = "Your report has been submitted and will be reviewed by our team. Thank you for keeping VitalMatch safe.";
            btn.innerText = "Back to Reports";
            btn.href = "reports.html";
        }
    </script>
</body>
</html>
