<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalMatch - Notifications</title>
    <script>if(localStorage.getItem('vm_theme')==='dark')document.documentElement.classList.add('dark-mode');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-none d-lg-block">
        <div class="mb-5 text-center"><div class="py-3"><svg width="100" height="100" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="250" cy="220" r="190" stroke="#4F46E5" stroke-width="25"/><path d="M250 470C250 470 426 310 426 190C426 100 346 30 256 30C166 30 86 100 86 190C86 310 256 470 256 470Z" fill="#EF4444"/><path d="M256 340C256 340 366 250 366 170C366 110 316 70 256 70C196 70 146 110 146 170C146 250 256 340 256 340Z" fill="white" fill-opacity="0.2"/><path d="M256 270C285 270 306 247 306 215C306 185 256 120 256 120C256 120 206 185 206 215C206 247 227 270 256 270Z" fill="white"/></svg><h4 class="fw-bold mt-2" style="color:#1E293B;"><span style="color:#EF4444;">Vital</span>Match</h4></div></div>
        <div class="nav flex-column">
            <a href="dashboard.html" class="sidebar-link"><i class="fas fa-columns"></i> <span data-i18n="dashboard">Dashboard</span></a>
            <a href="emergency-feed.html" class="sidebar-link"><i class="fas fa-broadcast-tower"></i> <span data-i18n="emergency_feed">Emergency Feed</span></a>
            <a href="search-donors.html" class="sidebar-link"><i class="fas fa-search"></i> <span data-i18n="search_donors">Search Donors</span></a>
            <a href="become-donor.html" class="sidebar-link"><i class="fas fa-hand-holding-medical"></i> <span data-i18n="become_donor">Become Donor</span></a>
            <a href="notifications.html" class="sidebar-link active"><i class="fas fa-bell"></i> <span data-i18n="notifications">Notifications</span></a>
            <a href="reports.html" class="sidebar-link"><i class="fas fa-file-alt"></i> <span data-i18n="reports">Reports</span></a>
            <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> <span data-i18n="profile">Profile</span></a>
            <a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i> <span data-i18n="settings">Settings</span></a>
            <hr class="my-4 text-muted">
            <a href="index.html" class="sidebar-link text-danger"><i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">Logout</span></a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Notifications</h2>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative cursor-pointer" onclick="window.location.href='notifications.html'" title="Notifications">
                    <i class="fas fa-bell fa-lg text-muted cursor-pointer"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </div>
                <div class="d-flex align-items-center gap-2 cursor-pointer" onclick="window.location.href='profile.html'" title="View Profile">
                    <img src="https://ui-avatars.com/api/?name=User&background=E53935&color=fff" class="rounded-circle user-avatar-display" width="40" height="40">
                    <div class="d-none d-sm-block"><p class="fw-bold mb-0 small user-name-display text-capitalize">User Name</p></div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="vm-card">
                    <div id="notificationsList" class="list-group list-group-flush">
                        <div class="text-center py-5"><span class="spinner-border text-primary"></span><p class="mt-2 text-muted">Loading notifications...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
    async function pageInit() {
        if (!currentProfile) return;
        const notifications = await DB.getNotifications(currentProfile.id);
        const container = document.getElementById('notificationsList');

        if (notifications.length === 0) {
            container.innerHTML = '<div class="text-center py-5"><i class="fas fa-bell-slash fa-3x text-muted mb-3"></i><h5 class="text-muted">No notifications yet</h5><p class="text-muted">You\'ll see emergency alerts and updates here.</p></div>';
            return;
        }

        const iconMap = { 
            URGENT: 'fa-exclamation-triangle text-danger', 
            emergency: 'fa-ambulance text-danger', 
            DONATION_SUCCESS: 'fa-heart text-success', 
            system: 'fa-cog text-primary', 
            info: 'fa-info-circle text-info' 
        };
        const bgMap = { 
            URGENT: 'bg-danger', 
            emergency: 'bg-danger', 
            DONATION_SUCCESS: 'bg-success', 
            system: 'bg-primary', 
            info: 'bg-info' 
        };

        container.innerHTML = notifications.map(n => {
            const iconClass = iconMap[n.type] || iconMap.info;
            const bgClass = bgMap[n.type] || bgMap.info;
            const isRequestNotif = n.type === 'URGENT' || (n.title && (n.title.toLowerCase().includes('request') || n.title.toLowerCase().includes('emergency')));

            return `
            <div class="list-group-item border-0 py-4 px-0 border-bottom ${n.is_read ? 'opacity-75' : ''}">
                <div class="d-flex">
                    <div class="${bgClass} bg-opacity-10 p-3 rounded-4 me-4" style="height:fit-content;">
                        <i class="fas ${iconClass} fa-lg"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-bold mb-0">${n.title}</h6>
                            <span class="text-muted smaller">${timeAgo(n.created_at)}</span>
                        </div>
                        <p class="text-muted small mb-3">${n.message}</p>
                        <div class="d-flex flex-wrap align-items-center gap-2" id="action-btns-${n.id}">
                            ${isRequestNotif ? `
                                <button onclick="acceptRequestAction(this, '${n.id}')" class="btn btn-sm btn-success fw-bold px-3">
                                    <i class="fas fa-check me-1"></i>Accept Request
                                </button>
                                <button onclick="declineRequestAction(this, '${n.id}')" class="btn btn-sm btn-outline-danger px-3">
                                    <i class="fas fa-times me-1"></i>Decline
                                </button>
                            ` : ''}
                            ${n.link ? `<a href="${n.link}" class="btn btn-sm btn-indigo px-3">View</a>` : ''}
                            ${!n.is_read ? `<button onclick="markRead(this, '${n.id}')" class="btn btn-sm btn-light border px-3">Mark Read</button>` : '<span class="badge bg-light text-muted">Read</span>'}
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function markRead(btn, notifId) {
        await DB.markNotificationRead(notifId);
        btn.closest('.list-group-item').classList.add('opacity-50');
        btn.outerHTML = '<span class="badge bg-light text-muted">Read</span>';
    }

    async function acceptRequestAction(btn, notifId) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Accepting...';
        
        try {
            if (currentProfile && currentProfile.id) {
                // Update blood_requests for this donor to Accepted
                await supabaseClient
                    .from('blood_requests')
                    .update({ status: 'Accepted' })
                    .eq('donor_user_id', currentProfile.id)
                    .eq('status', 'Pending');
            }
            await DB.markNotificationRead(notifId);
            
            const btnContainer = document.getElementById(`action-btns-${notifId}`);
            if (btnContainer) {
                btnContainer.innerHTML = '<span class="badge bg-success px-3 py-2 rounded-pill"><i class="fas fa-check-circle me-1"></i>Request Accepted</span>';
            }
            if (typeof showToast === 'function') {
                showToast('Blood Request Accepted successfully! Requester notified.', 'success');
            }
        } catch (e) {
            console.error(e);
            const btnContainer = document.getElementById(`action-btns-${notifId}`);
            if (btnContainer) {
                btnContainer.innerHTML = '<span class="badge bg-success px-3 py-2 rounded-pill"><i class="fas fa-check-circle me-1"></i>Request Accepted</span>';
            }
        }
    }

    async function declineRequestAction(btn, notifId) {
        btn.disabled = true;
        try {
            if (currentProfile && currentProfile.id) {
                await supabaseClient
                    .from('blood_requests')
                    .update({ status: 'Declined' })
                    .eq('donor_user_id', currentProfile.id)
                    .eq('status', 'Pending');
            }
            await DB.markNotificationRead(notifId);

            const btnContainer = document.getElementById(`action-btns-${notifId}`);
            if (btnContainer) {
                btnContainer.innerHTML = '<span class="badge bg-secondary px-3 py-2 rounded-pill">Declined</span>';
            }
        } catch (e) {
            console.error(e);
        }
    }
    </script>
</body>
</html>
